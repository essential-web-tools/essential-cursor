name: Publish to npm

# Só roda quando uma tag de release (v*) é enviada, nunca em push comum.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    name: Build, test and publish with provenance
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # necessário para OIDC trusted publishing / npm provenance

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # npm trusted publishing (OIDC) exige npm CLI >= 11.5.1, que só vem
      # por padrão a partir do Node >= 22.14. Node 20 traz um npm antigo
      # que falha silenciosamente ao tentar OIDC. Cache desligado aqui
      # também por recomendação oficial do npm para jobs de release.
      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports OIDC trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Tag v$TAG_VERSION não bate com package.json ($PKG_VERSION)"
            exit 1
          fi

      - name: Verify generated files are committed and unmodified
        run: git diff --exit-code -- dist

      - name: Publish
        run: npm publish --access public
